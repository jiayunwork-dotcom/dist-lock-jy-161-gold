version: '3.8'

services:
  node1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dist-lock-node1
    hostname: node1
    environment:
      - NODE_ID=node1
      - HTTP_ADDR=:8080
      - RAFT_ADDR=node1:7000
      - RAFT_PEERS=node1:7000,node2:7000,node3:7000
      - DATA_DIR=/data/node1
      - BOOTSTRAP=true
      - LEASE_TTL=30
      - DEADLOCK_DETECT_INTERVAL=5
      - LOG_LEVEL=info
    ports:
      - "8081:8080"
    volumes:
      - raft-data1:/data/node1
    networks:
      - dist-lock-net
    restart: unless-stopped

  node2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dist-lock-node2
    hostname: node2
    environment:
      - NODE_ID=node2
      - HTTP_ADDR=:8080
      - RAFT_ADDR=node2:7000
      - RAFT_PEERS=node1:7000,node2:7000,node3:7000
      - DATA_DIR=/data/node2
      - BOOTSTRAP=false
      - LEASE_TTL=30
      - DEADLOCK_DETECT_INTERVAL=5
      - LOG_LEVEL=info
    ports:
      - "8082:8080"
    volumes:
      - raft-data2:/data/node2
    networks:
      - dist-lock-net
    restart: unless-stopped
    depends_on:
      - node1

  node3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dist-lock-node3
    hostname: node3
    environment:
      - NODE_ID=node3
      - HTTP_ADDR=:8080
      - RAFT_ADDR=node3:7000
      - RAFT_PEERS=node1:7000,node2:7000,node3:7000
      - DATA_DIR=/data/node3
      - BOOTSTRAP=false
      - LEASE_TTL=30
      - DEADLOCK_DETECT_INTERVAL=5
      - LOG_LEVEL=info
    ports:
      - "8083:8080"
    volumes:
      - raft-data3:/data/node3
    networks:
      - dist-lock-net
    restart: unless-stopped
    depends_on:
      - node1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dist-lock-frontend
    hostname: frontend
    ports:
      - "8080:80"
    networks:
      - dist-lock-net
    restart: unless-stopped
    depends_on:
      - node1
      - node2
      - node3

  prometheus:
    image: prom/prometheus:latest
    container_name: dist-lock-prometheus
    hostname: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - dist-lock-net
    restart: unless-stopped

volumes:
  raft-data1:
  raft-data2:
  raft-data3:
  prometheus-data:

networks:
  dist-lock-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
