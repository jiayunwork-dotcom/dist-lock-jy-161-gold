global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dist-lock-cluster'
    static_configs:
      - targets: ['node1:8080', 'node2:8080', 'node3:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
